# Netlify 로 올릴 때만 쓰이는 파일입니다.
# 카페24·가비아 같은 일반 웹호스팅에서는 무시되고 .htaccess 가 대신 동작합니다.

[build]
  publish = "."

# chaminlaw.com 으로 들어온 접속을 www 로 넘깁니다.
# (Netlify 관리화면에서 www.chaminlaw.com 을 Primary domain 으로 지정하면
#  https 전환은 자동으로 처리됩니다.)
[[redirects]]
  from = "https://chaminlaw.com/*"
  to = "https://www.chaminlaw.com/:splat"
  status = 301
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=15552000"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=15552000"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=600"
