# 홈페이지가 바뀌면(새 칼럼 등) 바뀐 페이지 주소를 IndexNow(빙·네이버·얀덱스 등)에 자동으로 알린다.
# 수동 실행(Run workflow)하면 사이트맵의 모든 주소를 한 번에 보낸다.
name: IndexNow
on:
  push:
    branches: [main]
    paths: ['**.html', 'sitemap.xml']
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 2 }
      - name: Wait for GitHub Pages deploy
        run: sleep 120
      - name: Submit changed URLs
        env:
          KEY: 94075eef052f89fcdeb4756c6cbcb3da
          HOST: www.chaminlaw.com
          EVENT: ${{ github.event_name }}
        run: |
          python3 - <<'PY'
          import os, re, json, subprocess, urllib.request
          host, key = os.environ['HOST'], os.environ['KEY']
          base = f'https://{host}/'
          if os.environ['EVENT'] == 'workflow_dispatch':
              urls = re.findall(r'<loc>([^<]+)</loc>', open('sitemap.xml', encoding='utf-8').read())
          else:
              out = subprocess.run(['git', 'diff', '--name-only', '--diff-filter=AM', 'HEAD~1', 'HEAD'],
                                   capture_output=True, text=True).stdout.split()
              urls = []
              for f in out:
                  if not f.endswith('.html') or f.startswith('blog/_') or f == '404.html':
                      continue
                  path = f[:-len('index.html')] if f.endswith('index.html') else f
                  urls.append(base + path)
          if not urls:
              print('no page changes'); raise SystemExit(0)
          body = json.dumps({'host': host, 'key': key, 'keyLocation': f'{base}{key}.txt', 'urlList': urls[:10000]}).encode()
          req = urllib.request.Request('https://api.indexnow.org/indexnow', data=body,
                                       headers={'Content-Type': 'application/json; charset=utf-8'})
          try:
              r = urllib.request.urlopen(req, timeout=30); print('IndexNow', r.status, len(urls), 'urls')
          except urllib.error.HTTPError as e:
              print('IndexNow error', e.code, e.read()[:300]); raise
          for u in urls: print(' ', u)
          PY
